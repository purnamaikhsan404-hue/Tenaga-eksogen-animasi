<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi 3D Lengkap - Tenaga Eksogen & Pengaruhnya</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(26, 26, 46, 0.92);
            padding: 18px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 1.15rem;
            margin-bottom: 4px;
            color: #e94560;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #a0a0a0;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #16213e;
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: left;
            transition: all 0.3s ease;
            border-left: 4px solid #0f3460;
        }
        button:hover {
            background: #0f3460;
            transform: translateX(4px);
        }
        button.active {
            background: #e94560;
            border-left-color: #fff;
        }
        #info-box {
            background: rgba(15, 52, 96, 0.7);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #info-box h3 {
            color: #e94560;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.75);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>Animasi Tenaga Eksogen</h1>
        <div class="subtitle">Simulasi Lengkap: Pelapukan, Berbagai Jenis Erosi, & Sedimentasi</div>
        
        <div class="btn-group">
            <button onclick="setMode('pelapukan')" id="btn-pelapukan">1. Pelapukan (Weathering)</button>
            <button onclick="setMode('erosi')" id="btn-erosi">2. Erosi Umum (Erosion)</button>
            <button onclick="setMode('erosiAir')" id="btn-erosiAir">3. Erosi Air (Fluvial)</button>
            <button onclick="setMode('erosiAngin')" id="btn-erosiAngin">4. Erosi Angin (Aeolian)</button>
            <button onclick="setMode('erosiLaut')" id="btn-erosiLaut">5. Erosi Gelombang Laut (Abrasi)</button>
            <button onclick="setMode('sedimentasi')" id="btn-sedimentasi">6. Sedimentasi (Pengendapan)</button>
        </div>

        <div id="info-box">
            <h3 id="info-title">Pilih Materi</h3>
            <p id="info-desc">Klik tombol menu di atas untuk mengontrol animasi 3D bergerak sesuai materi buku teks Geografi.</p>
        </div>
    </div>

    <div class="controls-hint">Kontrol Kamera: Klik & Geser Mouse untuk Memutar | Scroll untuk Zoom</div>

    <script>
        let scene, camera, renderer, terrain, treesGroup = [], dynamicGroup = [], activeMode = 'pelapukan';
        let mainObject, particleSystem;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0, cameraRadius = 26, cameraHeight = 13;
        let clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(25, 35, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createTerrain();
            createParticles();

            window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.008;
                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('wheel', (e) => {
                cameraRadius = Math.max(16, Math.min(42, cameraRadius + e.deltaY * 0.02));
                updateCameraPosition();
            });

            window.addEventListener('resize', onWindowResize);

            setMode('pelapukan');
            animate();
        }

        function updateCameraPosition() {
            camera.position.x = Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 2, 0);
        }

        function createProceduralTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'rocky') {
                ctx.fillStyle = '#6b5b52';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 2500; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#4a3b32' : '#9c8b82';
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 6 + 2, Math.random() * 6 + 2);
                }
            } else if (type === 'soil') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 3000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#5c2c16' : '#a0522d';
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 4 + 1, Math.random() * 4 + 1);
                }
            } else if (type === 'water') {
                ctx.fillStyle = '#1e90ff';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 1500; i++) {
                    ctx.fillStyle = '#00bfff';
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 8 + 2, Math.random() * 2 + 1);
                }
            } else {
                ctx.fillStyle = '#c2b280';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 2500; i++) {
                    ctx.fillStyle = '#d4c59d';
                    ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 5 + 2, Math.random() * 3 + 1);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createTerrain() {
            const geometry = new THREE.BoxGeometry(22, 2, 22);
            const texture = createProceduralTexture('soil');
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.85 });
            terrain = new THREE.Mesh(geometry, material);
            terrain.position.y = -1;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.25 * scale, 0.35 * scale, 1.8 * scale, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.9 * scale;
            group.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(1.3 * scale, 2.8 * scale, 6);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.7 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2.4 * scale;
            group.add(leaves);

            group.position.set(x, 0, z);
            scene.add(group);
            treesGroup.push(group);
        }

        function clearSceneObjects() {
            treesGroup.forEach(tree => scene.remove(tree));
            treesGroup = [];
            dynamicGroup.forEach(obj => scene.remove(obj));
            dynamicGroup = [];
            if (mainObject) { scene.remove(mainObject); mainObject = null; }
            if (particleSystem) { scene.remove(particleSystem); particleSystem = null; }
        }

        function createParticles(count = 300, color = 0xcccccc) {
            const pGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 16;
                positions[i+1] = Math.random() * 10;
                positions[i+2] = (Math.random() - 0.5) * 16;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const pMat = new THREE.PointsMaterial({ color: color, size: 0.18, transparent: true, opacity: 0.8 });
            particleSystem = new THREE.Points(pGeo, pMat);
            scene.add(particleSystem);
        }

        function setMode(mode) {
            activeMode = mode;
            clearSceneObjects();

            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            const title = document.getElementById('info-title');
            const desc = document.getElementById('info-desc');

            if (mode === 'pelapukan') {
                title.innerText = "1. Pelapukan (Weathering)";
                desc.innerText = "Perombakan batuan besar menjadi bagian lebih kecil akibat perubahan suhu, air, dan organisme/akar tumbuhan. Batuan bergetar dan retak perlahan.";

                const rockGeo = new THREE.DodecahedronGeometry(2.5, 1);
                const rockMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('rocky'), roughness: 0.9 });
                mainObject = new THREE.Mesh(rockGeo, rockMat);
                mainObject.position.set(0, 1.3, 0);
                scene.add(mainObject);

                createTree(-2.5, -1, 1.2);
                createTree(2.2, 1.5, 1.0);

            } else if (mode === 'erosi') {
                title.innerText = "2. Erosi Umum (Erosion)";
                desc.innerText = "Pengikisan dan pemindahan material tanah/batuan secara umum menuruni lereng oleh gaya berat dan tenaga air.";

                const cliffGeo = new THREE.BoxGeometry(18, 3, 6);
                const cliffMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('soil'), roughness: 0.8 });
                mainObject = new THREE.Mesh(cliffGeo, cliffMat);
                mainObject.position.set(0, 0.5, -3);
                scene.add(mainObject);

                createTree(-4, -2, 1);
                createTree(4, -2, 1.1);
                createParticles(350, 0xaaaaaa);

            } else if (mode === 'erosiAir') {
                title.innerText = "3. Erosi Air (Fluvial)";
                desc.innerText = "Pengikisan tanah/batuan oleh aliran air sungai atau hujan, membentuk alur-alur, lembah berbentuk V atau U di permukaan bumi.";

                // Alur Sungai 3D
                const riverGeo = new THREE.BoxGeometry(16, 0.2, 4);
                const riverMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('water'), roughness: 0.3 });
                mainObject = new THREE.Mesh(riverGeo, riverMat);
                mainObject.position.set(0, 0.1, 0);
                scene.add(mainObject);

                createParticles(400, 0x1e90ff); // Partikel aliran air

            } else if (mode === 'erosiAngin') {
                title.innerText = "4. Erosi Angin (Aeolian)";
                desc.innerText = "Pengikisan batuan di daerah gurun pasir kering oleh angin yang membawa partikel pasir (abrasimengikis batuan hingga berlubang/bentuk unik).";

                // Batuan Berlubang khas gurun
                const rockGeo = new THREE.BoxGeometry(3, 3, 3);
                const rockMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('rocky'), roughness: 0.9 });
                mainObject = new THREE.Mesh(rockGeo, rockMat);
                mainObject.position.set(0, 1.5, 0);
                scene.add(mainObject);

                createParticles(400, 0xd4c59d); // Badai pasir terbang horizontal

            } else if (mode === 'erosiLaut') {
                title.innerText = "5. Erosi Gelombang Laut (Abrasi)";
                desc.innerText = "Pengikisan pantai oleh hantaman gelombang air laut secara terus-menerus, merusak tebing pantai (cliff) dan struktur daratan.";

                // Tebing Pantai
                const cliffGeo = new THREE.BoxGeometry(18, 3, 4);
                const cliffMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('rocky'), roughness: 0.85 });
                mainObject = new THREE.Mesh(cliffGeo, cliffMat);
                mainObject.position.set(0, 0.5, -4);
                scene.add(mainObject);

                // Permukaan Air Laut Bergerak
                const seaGeo = new THREE.PlaneGeometry(22, 14);
                const seaMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff, roughness: 0.4, transparent: true, opacity: 0.8 });
                const sea = new THREE.Mesh(seaGeo, seaMat);
                sea.rotation.x = -Math.PI / 2;
                sea.position.set(0, 0.05, 3);
                scene.add(sea);
                dynamicGroup.push(sea);

            } else if (mode === 'sedimentasi') {
                title.innerText = "6. Sedimentasi (Deposition)";
                desc.innerText = "Pengendapan material hasil erosi di tempat yang lebih rendah (dataran aluvial, muara, pantai), menjadi tempat subur bagi kehidupan.";

                const sedGeo = new THREE.ConeGeometry(6, 1.5, 12);
                const sedMat = new THREE.MeshStandardMaterial({ map: createProceduralTexture('sand'), roughness: 0.7 });
                mainObject = new THREE.Mesh(sedGeo, sedMat);
                mainObject.position.set(0, 0, 0);
                scene.add(mainObject);

                createTree(-3, -3, 1.3);
                createTree(3, -3, 1.2);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Animasi Dinamis Sesuai Mode Aktif
            if (activeMode === 'pelapukan' && mainObject) {
                mainObject.rotation.y = Math.sin(elapsedTime * 2) * 0.08;
                mainObject.scale.set(
                    1 + Math.sin(elapsedTime * 3) * 0.03,
                    1 + Math.cos(elapsedTime * 2) * 0.03,
                    1 + Math.sin(elapsedTime * 2.5) * 0.03
                );
            } else if ((activeMode === 'erosi' || activeMode === 'erosiAir') && particleSystem) {
                const positions = particleSystem.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.2; // Aliran mengalir ke bawah
                    if (positions[i] < 0) positions[i] = 10;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            } else if (activeMode === 'erosiAngin' && particleSystem) {
                // Partikel pasir bergerak horizontal menabrak batuan
                const positions = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += 0.25; // Bergerak dari kiri ke kanan
                    if (positions[i] > 8) positions[i] = -8;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                if (mainObject) mainObject.rotation.y = Math.sin(elapsedTime * 4) * 0.04;
            } else if (activeMode === 'erosiLaut' && dynamicGroup.length > 0) {
                // Gelombang laut menghantam tebing maju-mundur
                const sea = dynamicGroup[0];
                sea.position.z = 3 + Math.sin(elapsedTime * 4) * 1.2;
            } else if (activeMode === 'sedimentasi' && mainObject) {
                mainObject.rotation.y = elapsedTime * 0.4;
            }

            // Pohon bergoyang lembut
            treesGroup.forEach((tree, idx) => {
                tree.rotation.z = Math.sin(elapsedTime * 3 + idx) * 0.03;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
